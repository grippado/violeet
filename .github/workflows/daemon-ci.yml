# Builds and tests the Rust workspace on every change that touches it.
#
# The other track. `app-ci.yml` says the Rust workspace "belongs to another
# track and gets its own file" — this is that file, and it was missing for long
# enough that 259 passing tests were running on no machine but a laptop. A test
# nobody runs is a test that is already broken and has not been told.
#
# Same shape as the app's workflow on purpose: same trigger style, same
# concurrency rule, same tolerance for warnings. Two workflows that behave
# differently for no reason are two workflows to reason about.
#
# Path-filtered so neither track can turn the other one red, and so a change to
# the Swift app does not spend three minutes compiling Rust to say nothing.

name: daemon

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/daemon-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/daemon-ci.yml"
  workflow_dispatch:

concurrency:
  group: daemon-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Backtraces cost nothing on a green run and are the whole diagnosis on a red
  # one, where the alternative is pushing a commit to add them.
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    # macOS, and not the cheaper Linux runner. The daemon is not portable code
    # that happens to run here: it binds a Unix socket under the user's
    # Application Support, reads Claude Code's transcripts from a macOS path,
    # and is launched by launchd. A green Linux run would be testing a
    # different program.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        # `rust-toolchain.toml` pins the channel and the components, so there is
        # nothing to install — but which stable it resolved to belongs in the
        # log, because "it broke on a new compiler" is otherwise invisible.
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The lockfile is the key: same dependencies, same cache. The runner
          # image is in it too, because a cached `target/` from another macOS
          # image is a rebuild that looks like a cache hit.
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Not a gate, and deliberately so — the same call the app's workflow makes
      # about warnings. This is a young codebase, the findings today are three
      # small ones, and a lint gate whose first act is to fail an unrelated pull
      # request teaches people to ignore it.
      #
      # `|| true` rather than `continue-on-error`, so the step reads as green
      # and the output is still in the log where somebody will see it.
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets || true

      # Formatting is not checked here yet. `cargo fmt` has never been run
      # across this workspace, so the check fails in about seventy places today
      # — and the fix is one mechanical commit that must not arrive mixed into
      # somebody's feature. Turn this into a gate in the same commit that
      # formats the tree, not before.
