[workspace]
resolver = "2"
members = [
    "crates/aiterm-proto",
    "crates/aiterm-daemon",
    "crates/aiterm-cli",
    "crates/aiterm-transcript",
]

# This file was READ-ONLY during the fan-out waves, so parallel tracks could not
# collide on it. Both waves are finished and it is editable again. The habit it
# enforced is still the right default: a dependency needed by one crate belongs
# in that crate's manifest, not here.
[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Gabriel Gripp"]
repository = "https://github.com/grippado/aiterm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
