# XcodeGen spec. The .xcodeproj is generated from this file and is NOT committed
# — pbxproj is machine-written XML and conflicts badly when parallel tracks touch
# the app. Regenerate with:  cd app && xcodegen generate
name: Violeet

options:
  bundleIdPrefix: digital.opengateway.violeet
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.15.0

targets:
  Violeet:
    type: application
    platform: macOS
    sources:
      - path: Sources/Violeet
    dependencies:
      - package: SwiftTerm
    # Deliberately NOT an `info:` block. XcodeGen's `info:` *generates*
    # Sources/Violeet/Info.plist, overwriting it on every `xcodegen generate` —
    # and that same file is the one `scripts/package.sh` copies into the bundle
    # it assembles without Xcode. One file, one author: the plist is committed
    # and hand-maintained, and Xcode is pointed at it rather than handed a
    # recipe to rewrite it from.
    settings:
      base:
        INFOPLIST_FILE: Sources/Violeet/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: digital.opengateway.violeet
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        # The entitlements file exists for one key, audio input, and it is here
        # for a process this app does not contain: an agent running in a tab.
        # Under the hardened runtime the runtime blocks the microphone before
        # TCC is ever consulted, so the NSMicrophoneUsageDescription in
        # Info.plist fixes only the ad-hoc build and leaves the signed one
        # broken — in the way hardest to notice, since the build that ships is
        # not the build dictation gets tested on. The sandbox stays off (below);
        # this is not a step toward turning it on.
        #
        # The rationale lives here and not in the file because the file cannot
        # hold it: AMFI's entitlements parser rejects XML comments outright
        # ("syntax error"), so codesign fails on a commented plist.
        CODE_SIGN_ENTITLEMENTS: Sources/Violeet/Violeet.entitlements
        # The app spawns PTYs and talks to a Unix socket in ~/.violeet.
        # Sandboxing is deliberately off for v0 — revisit before distribution.
        ENABLE_APP_SANDBOX: false
